# Fixed, scripted safety replies (SPEC 8.2). These are NOT generated by the LLM.
# {name} = how Kaifong addresses the person; hotline numbers come from config (HOTLINE_*), never from here.
# TODO: native Cantonese speaker must review every yue line; team must verify every hotline number.
fall:
  yue: "{name}，聽到你跌親，我好擔心。你有冇受傷呀？我而家即刻通知你嘅社工。如果好緊急，請即刻打{emergency}，或者按你部緊急鐘。"
  en: "{name}, I'm so sorry to hear you fell. Are you hurt? I'm letting your social worker know right now. If it's an emergency, please call {emergency} or press your emergency bell."
cardiac_breathing:
  yue: "{name}，心口痛或者透唔到氣可能好緊急。如果而家仲係咁，請即刻打{emergency}，或者按你部緊急鐘。我而家即刻通知你嘅社工。"
  en: "{name}, chest pain or trouble breathing can be serious. If it's happening now, please call {emergency} or press your emergency bell. I'm letting your social worker know right now."
stroke_signs:
  yue: "{name}，講嘢唔清或者半邊身冇力可能好緊急。請即刻打{emergency}，或者按你部緊急鐘。我而家即刻通知你嘅社工。"
  en: "{name}, trouble speaking or weakness on one side can be serious. Please call {emergency} or press your emergency bell now. I'm letting your social worker know right now."
acute_unwell:
  yue: "{name}，你而家好唔舒服，我好擔心。如果好緊急，請即刻打{emergency}，或者按你部緊急鐘。我而家即刻通知你嘅社工。"
  en: "{name}, I'm worried that you're feeling so unwell. If it's an emergency, please call {emergency} or press your emergency bell. I'm letting your social worker know right now."
self_harm:
  yue: "{name}，多謝你肯同我講。你唔係一個人。我而家即刻通知你嘅社工，佢好快會聯絡你。如果你覺得好辛苦，可以打{mental_health}或者{sbhk}搵人傾下。如果有危險，請即刻打{emergency}。"
  en: "{name}, thank you for telling me. You are not alone. I'm letting your social worker know right now and they will contact you soon. If things feel very heavy, you can call {mental_health} or {sbhk} to talk to someone. If you are in danger, please call {emergency}."
general:
  yue: "{name}，我聽到你講嘅嘢，有啲擔心。我而家通知你嘅社工，等佢跟進。如果有咩緊急，請即刻打{emergency}。"
  en: "{name}, I heard what you said and I'm a little worried. I'm letting your social worker know so they can follow up. If anything is urgent, please call {emergency}."
followups:   # after a red flag the call stays gentle and short: no checklist questions
  - { yue: "我喺度陪住你。你嘅社工已經知道喇。你而家安全嗎？有冇邊個喺你身邊呀？", en: "I'm here with you. Your social worker has been told. Are you safe right now? Is anyone with you?" }
  - { yue: "好，我哋唔急。你嘅社工好快聯絡你。有咩需要我幫手？", en: "Alright, there's no rush. Your social worker will contact you soon. Is there anything you need?" }
safety_close:
  yue: "{name}，你嘅社工會好快聯絡你。記住有咩事隨時打{emergency}。照顧好自己，我聽日再打俾你。"
  en: "{name}, your social worker will contact you soon. Remember you can call {emergency} any time. Take care, I'll call again tomorrow."
opt_out:
  confirm:
    yue: "{name}，多謝你講俾我知。我只係想確認一下：你係唔想我哋再打電話俾你，係嗎？你嘅社工會親自上嚟同你傾。"
    en: "{name}, thank you for telling me. Just to check: you'd like us to stop calling you, is that right? Your social worker will come to talk with you in person."
  done:
    yue: "明白，{name}。多謝你一直同我傾偈，我哋即刻暫停打電話。你嘅社工會上嚟探你。祝你身體健康，拜拜！"
    en: "I understand, {name}. Thank you for all our chats. We're pausing the calls right away, and your social worker will visit you. Take care, goodbye!"
  resumed:
    yue: "好呀，冇問題，我哋繼續傾偈。"
    en: "Of course, no problem. Let's keep chatting."
