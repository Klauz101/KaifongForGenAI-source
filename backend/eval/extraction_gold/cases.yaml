# Extraction gold set (SPEC 15 Phase 7): 30 SYNTHETIC call transcripts with hand-written gold values.
# Written by the developers, not real older speakers. Unlisted gold fields take the default:
#   mood null, sleep/appetite/meds_taken/pain/went_out_today unknown, social_contact [none_mentioned],
#   loneliness false, confusion [none].  "unknown" is the RIGHT answer when the person did not say.
# tag: easy = plain wording; negation = traps; hard = paraphrase the offline keyword extractor was not designed for
#      (it exists to show honest accuracy; do not tune the extractor or the gold to hit a target).
# TODO: add transcripts from consented real calls (never commit real recordings or names).
