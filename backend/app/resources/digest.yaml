# Weekly family digest wording (SPEC 10.1). Warm, plain, never clinical, no transcripts, no diagnoses.
# Only what the older person consented to share is used. TODO: native Cantonese review.
en:
  intro: "Hello! Here is how {name}'s week went with Kaifong ({start} to {end})."
  chats: "Kaifong chatted with {name} on {n} of the last 7 days."
  mood_high: "{name} sounded cheerful on most days."
  mood_mid: "{name} sounded fairly steady this week."
  mood_low: "{name} sounded a little low on some days."
  out_some: "{name} got out of the house on {k} days."
  out_less: "{name} stayed in more than usual this week. A short walk together could be lovely."
  meals_ok: "Meals sounded fine."
  nudge_accepted: "{name} liked the idea of {what}."
  nudge_done: "{name} liked the idea of {what}, and it happened. That is lovely to hear!"
  lonely: "{name} mentioned feeling a little lonely at times. A call or visit from you would mean a lot."
  care_team: "The care team is keeping a gentle eye on a few things and will be in touch if there is anything you need to know."
  ask_about: "Something you could ask about: {facts}."
  call_time: "A good time to call: {when}."
  when_morning_call: "in the afternoon (around 3-5 pm) or early in the evening"
  when_afternoon_call: "in the morning (around 10 am)"
  closing: "This is a short friendly summary, not a medical report. The care team is always here if you have any worries."
  nudge_kinds: { go_outside: "going for a walk", call_family: "calling family", meet_friend: "meeting a friend", centre_activity: "trying a centre activity" }
yue:
  intro: "你好！呢個係{name}呢個星期同街坊傾偈嘅情況（{start} 至 {end}）。"
  chats: "過去 7 日入面，街坊有 {n} 日同{name}傾過偈。"
  mood_high: "{name}大部分日子都好開心。"
  mood_mid: "{name}呢個星期心情算平穩。"
  mood_low: "{name}有幾日心情有啲低落。"
  out_some: "{name}有 {k} 日出過街。"
  out_less: "{name}呢個星期比平時少出街。你哋一齊落樓下行下會好好。"
  meals_ok: "食飯方面聽落冇問題。"
  nudge_accepted: "{name}對「{what}」有興趣。"
  nudge_done: "{name}對「{what}」有興趣，而且已經做到喇，好開心！"
  lonely: "{name}有時會覺得有啲孤單。你打個電話或者探下佢，佢會好開心。"
  care_team: "照顧團隊會留意幾件事，有需要會聯絡你。"
  ask_about: "你可以同佢傾下：{facts}。"
  call_time: "好時間打俾佢：{when}。"
  when_morning_call: "下午（大約三至五點）或者傍晚"
  when_afternoon_call: "上午（大約十點）"
  closing: "呢份係簡短嘅友善摘要，並非醫療報告。如果你有任何擔心，照顧團隊隨時都喺度。"
  nudge_kinds: { go_outside: "落街行下", call_family: "打電話俾家人", meet_friend: "約朋友", centre_activity: "參加中心活動" }
